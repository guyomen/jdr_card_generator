[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jdr-card-generator"
version = "1.0.0"
description = "Générateur de cartes JDR avec support des images IA"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
keywords = ["jdr", "rpg", "cards", "pdf", "ai", "diffusers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
images-local = [
    "diffusers>=0.20.0",
    "torch>=2.0.0",
    "transformers>=4.25.0",
    "torchvision>=0.15.0",
    "accelerate>=0.20.0",
    "pillow>=9.0.0",
]
images-directml = [
    "torch-directml>=0.2.0",
]
images-openai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

[project.scripts]
jdr-cards = "card_generator.cli:main"

[project.urls]
Homepage = "https://github.com/guyomen/jdr_card_generator"
Repository = "https://github.com/guyomen/jdr_card_generator.git"
"Bug Tracker" = "https://github.com/guyomen/jdr_card_generator/issues"

[tool.setuptools]
packages = ["card_generator"]

[tool.setuptools.package-data]
card_generator = []

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
